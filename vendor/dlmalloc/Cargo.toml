[dependencies.cfg-if]
version = "1.0"

[dependencies.core]
optional = true
package = "rustc-std-workspace-core"
version = "1.0.0"

[dev-dependencies.arbitrary]
version = "1.3.2"

[dev-dependencies.rand]
features = ["small_rng"]
version = "0.8"

[features]
debug = []
global = []
rustc-dep-of-std = ["core"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Alex Crichton <alex@alexcrichton.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = """
A Rust port of the dlmalloc allocator
"""
documentation = "https://docs.rs/dlmalloc"
edition = "2021"
exclude = ["src/dlmalloc.c"]
homepage = "https://github.com/alexcrichton/dlmalloc-rs"
license = "MIT/Apache-2.0"
name = "dlmalloc"
readme = "README.md"
repository = "https://github.com/alexcrichton/dlmalloc-rs"
version = "0.2.14"

[package.metadata.docs.rs]
features = ["global"]

[profile.release]
debug-assertions = true

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies.libc]
default-features = false
version = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation"]
version = ">=0.52.0, <=0.61.*"
