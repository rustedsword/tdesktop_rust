keywords = ["build-dependencies"]
license = "MIT OR Apache-2.0"
name = "find-msvc-tools"
readme = "README.md"
repository = "https://github.com/rust-lang/cc-rs"
rust-version = "1.64.0"
version = "0.1.10"
